spring.application.name=book_upload
# Cấu hình kết nối đến database
spring.datasource.url=jdbc:postgresql://localhost:5432/db_book
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver
# Cấu hình JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

#Cấu hình về dung lượng file
#Giới hạn dung lượngh của một file
spring.servlet.multipart.max-file-size=10MB
#Giới hạn dung lượng của tổng các file của 1 request gửi lên
spring.servlet.multipart.max-request-size=50MB
